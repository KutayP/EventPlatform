name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EventPlatform.slnx

      - name: Build
        run: dotnet build EventPlatform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EventPlatform.slnx --configuration Release --no-build --verbosity normal

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        run: docker build -t eventplatform:ci .
